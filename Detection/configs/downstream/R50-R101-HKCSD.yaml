_BASE_: "../Base-Distillation.yaml"
OUTPUT_DIR: output/downstream/R50-R101/hcksd/detection
INPUT:
  FORMAT: 'RGB'
MODEL:
  PIXEL_STD: [ 57.375, 57.120, 58.395 ]
  BACKBONE:
    NAME: "build_resnet_fpn_backbone_kd"
  WEIGHTS: "/mnt/home/chendingyao/ReviewKD_Detection/Detection/pretrained/hkcsd_kd_r50_r101.pth"
  RESNETS:
    OUT_FEATURES: [ "res2", "res3", "res4", "res5" ]
    DEPTH: 50
  FPN:
    IN_FEATURES: [ "res2", "res3", "res4", "res5" ]
  PROPOSAL_GENERATOR:
    NAME: "RPN"
  ROI_HEADS:
    NAME: "StandardROIHeads"

TEACHER:
  MODEL:
    RESNETS:
      DEPTH: 101
KD:
  TYPE: "Baseline"


SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.01
  MAX_ITER: 180000
  STEPS:
    - 120000
    - 160000