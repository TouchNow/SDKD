_BASE_: "../Base-Distillation.yaml"
OUTPUT_DIR: output/SDD-R50-R101
MODEL:
  BACKBONE:
    NAME: "build_resnet_fpn_backbone_kd"
  WEIGHTS: "pretrained/r50-r101.pth"
  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    DEPTH: 50
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  PROPOSAL_GENERATOR:
    NAME: "RPN"
  ROI_HEADS:
    NAME: "StandardROIHeads"

TEACHER:
  MODEL:
    RESNETS:
      DEPTH: 101
KD:
  TYPE: "SDD"
  SDD:
    T: 1.0
    LOSS_WEIGHT: 1.0
    BETA: 2.0
    SCALES: [1, 2]

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.01
  MAX_ITER: 180000
  CHECKPOINT_PERIOD: 180001
  STEPS:
    - 120000
    - 160000
