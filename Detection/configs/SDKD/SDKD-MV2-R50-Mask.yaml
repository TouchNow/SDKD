_BASE_: "../Base-Distillation.yaml"
OUTPUT_DIR: output/SDKD-MV2-R50-Mask
MODEL:
  MASK_ON: True
  BACKBONE:
    NAME: "build_mobilenetv2_fpn_backbone"
    FREEZE_AT: 0
  WEIGHTS: "pretrained/mv2-r50mask.pth"
  MOBILENETV2:
    OUT_FEATURES: ["m2", "m3", "m4", "m5"]
  FPN:
    IN_FEATURES: ["m2", "m3", "m4", "m5"]
  PROPOSAL_GENERATOR:
    NAME: "RPN"
  ROI_HEADS:
    NAME: "StandardROIHeads"

TEACHER:
  MODEL:
    RESNETS:
      DEPTH: 50
KD:
  TYPE: "SDKD"
  SDKD:
    INARANK_WEIGHT: 0.5
    T: 1.0
    HEAD_WEIGHT: 1.0
    TAIL_WEIGHT: 0.25

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.01
  MAX_ITER: 180000
  CHECKPOINT_PERIOD: 180001
  STEPS:
    - 120000
    - 160000
